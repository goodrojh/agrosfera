<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>АгроСфера — панель управления</title>
<style>
  :root {
    --brand: #1f5a25; --brand-dark: #174a1c; --leaf: #8cc152; --bg: #f5f7f2; --card: #fff;
    --line: #e4e9df; --text: #14201a; --muted: #6b7768; --red: #c0492f; --amber: #b7791f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 -apple-system, "Segoe UI", Inter, Roboto, sans-serif; color: var(--text); background: var(--bg); }
  button, input, select, textarea { font: inherit; }
  .hidden { display: none !important; }

  /* Вход */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .login form { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 28px; }
  .login h1 { font-size: 20px; margin: 0 0 4px; }
  .login p { color: var(--muted); margin: 0 0 18px; font-size: 14px; }

  /* Шапка */
  header { background: #07160a; color: #fff; padding: 0 20px; }
  .bar { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 60px; }
  .logo { font-weight: 700; letter-spacing: .12em; font-size: 14px; }
  .logo span { font-weight: 400; letter-spacing: 0; opacity: .6; margin-left: 10px; }
  .bar .right { display: flex; align-items: center; gap: 16px; font-size: 13px; color: rgba(255,255,255,.7); }
  .bar button { background: transparent; border: 1px solid rgba(255,255,255,.25); color: #fff; border-radius: 10px; padding: 6px 12px; cursor: pointer; }

  main { max-width: 1280px; margin: 0 auto; padding: 20px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .tab { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 9px 14px; cursor: pointer; color: var(--muted); }
  .tab.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .tab b { display: inline-block; min-width: 20px; margin-left: 6px; padding: 0 6px; border-radius: 10px; background: rgba(0,0,0,.08); font-size: 12px; text-align: center; }
  .tab.on b { background: rgba(255,255,255,.2); }
  .tab b.hot { background: var(--red); color: #fff; }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .panel-head h2 { font-size: 16px; margin: 0; }
  .panel-head p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 500; font-size: 12px; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line); background: #fafbf8; }
  td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 14px; }
  tr:last-child td { border-bottom: 0; }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: #f7faf4; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  .sub { color: var(--muted); font-size: 12px; }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }

  .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .b-new { background: #fff4e0; color: var(--amber); }
  .b-active { background: #e8f3e0; color: var(--brand); }
  .b-blocked { background: #f1f1f1; color: #777; }
  .b-pending { background: #fff4e0; color: var(--amber); }
  .role { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 6px; margin-left: 6px; vertical-align: 1px; }
  .r-producer { background: #fdeee9; color: var(--red); }
  .r-exporter, .r-agent { background: #e8f3e0; color: var(--brand); }
  .hl { background: #fff8e6; }
  .chip { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 8px; background: #eef3e8; color: var(--brand); margin: 0 4px 4px 0; }

  .btn { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 14px; cursor: pointer; color: var(--text); }
  .btn:hover { border-color: #c9d3c2; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: var(--brand-dark); }
  .btn.danger { color: var(--red); }
  .btn.sm { padding: 5px 10px; font-size: 13px; }
  .btn:disabled { opacity: .45; cursor: default; }

  input[type=text], input[type=password], input[type=tel], select, textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; background: #fff; color: var(--text);
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(31,90,37,.1); }
  label.f { display: block; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  label.f > input, label.f > select, label.f > textarea { margin-top: 4px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .err { color: var(--red); font-size: 14px; margin-top: 10px; }

  /* Карточка участника */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 10; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--bg); z-index: 11; display: flex; flex-direction: column; box-shadow: -10px 0 40px rgba(0,0,0,.15); }
  .drawer-head { background: #fff; border-bottom: 1px solid var(--line); padding: 16px 20px; display: flex; justify-content: space-between; gap: 12px; }
  .drawer-head h3 { margin: 0; font-size: 18px; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .drawer-foot { background: #fff; border-top: 1px solid var(--line); padding: 12px 20px; display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
  .box { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  .box h4 { margin: 0 0 10px; font-size: 14px; }
  .access { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
  .access input { width: 22px; height: 22px; accent-color: var(--brand); margin-top: 2px; flex-shrink: 0; }
  .access b { display: block; font-size: 16px; }
  .crops { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
  .crops label { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; padding: 4px 0; }
  .crops input { width: 18px; height: 18px; accent-color: var(--brand); }
  .copy { display: flex; gap: 6px; }
  .copy input { font-size: 13px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #07160a; color: #fff; padding: 10px 16px; border-radius: 10px; z-index: 20; font-size: 14px; }
  @media (max-width: 720px) { .grid2, .crops { grid-template-columns: 1fr; } td, th { padding: 9px 10px; } .hide-sm { display: none; } }
</style>
</head>
<body>

<!-- Вход -->
<section id="login" class="login hidden">
  <form id="loginForm">
    <h1>Панель управления</h1>
    <p>АгроСфера · анкеты, участники, модерация</p>
    <label class="f">Пароль<input type="password" id="pw" autocomplete="current-password" autofocus /></label>
    <button class="btn primary" style="width:100%">Войти</button>
    <div id="loginErr" class="err"></div>
  </form>
</section>

<!-- Приложение -->
<section id="app" class="hidden">
  <header>
    <div class="bar">
      <div class="logo">АГРОСФЕРА<span>панель управления</span></div>
      <div class="right"><span id="botName"></span><span id="updated"></span><button id="logout">Выйти</button></div>
    </div>
  </header>
  <main>
    <nav class="tabs" id="tabs"></nav>
    <div id="view"></div>
  </main>
</section>

<div id="drawerRoot"></div>
<div id="toast" class="toast hidden"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rub = (n) => Math.round(n).toLocaleString("ru-RU");
const date = (ms) => new Date(ms).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
const store = { get: (k) => { try { return sessionStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { v ? sessionStorage.setItem(k, v) : sessionStorage.removeItem(k); } catch {} } };

let token = store.get("agr-admin");
let data = null;
let tab = "new";
let openId = null;

function toast(text) {
  const t = $("#toast");
  t.textContent = text;
  t.classList.remove("hidden");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.add("hidden"), 2200);
}

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}`, ...(opts.headers || {}) } });
  const body = await res.json().catch(() => ({}));
  if (res.status === 401 && path !== "/api/admin/login") { logout(); throw new Error(body.error || "Войдите заново"); }
  if (!res.ok) throw new Error(body.error || "Ошибка");
  return body;
}

function logout() {
  token = null;
  store.set("agr-admin", null);
  $("#app").classList.add("hidden");
  $("#login").classList.remove("hidden");
}

$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("#loginErr").textContent = "";
  try {
    const r = await api("/api/admin/login", { method: "POST", body: JSON.stringify({ password: $("#pw").value }) });
    token = r.token;
    store.set("agr-admin", token);
    start();
  } catch (err) { $("#loginErr").textContent = err.message; }
});
$("#logout").addEventListener("click", logout);

const cropName = (id) => data.crops.find((c) => c.id === id)?.name || id;
const regionName = (id) => data.regions.find((r) => r.id === id)?.name || id;
const ROLE = { producer: "предприятие", exporter: "экспортёр", agent: "агент" };
const roleTag = (r) => `<span class="role r-${r}">${ROLE[r] || r}</span>`;
const STATUS = { new: ["Новая анкета", "b-new"], active: ["Доступ открыт", "b-active"], blocked: ["Отключён", "b-blocked"] };
const badge = (s) => `<span class="badge ${STATUS[s][1]}">${STATUS[s][0]}</span>`;

async function load() {
  data = await api("/api/admin/overview");
  $("#botName").textContent = data.bot ? `Бот ${data.bot}` : "Бот не подключён";
  $("#updated").textContent = `обновлено ${new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" })}`;
  render();
}

function render() {
  const fresh = data.companies.filter((c) => c.status === "new");
  const partners = data.companies.filter((c) => c.status !== "new");
  const pendingBids = data.bids.filter((b) => b.status === "pending");
  const freshMatches = data.matches.filter((m) => m.status === "new");
  const tabs = [
    ["new", "Анкеты", fresh.length, fresh.length > 0],
    ["matches", "Совпадения", freshMatches.length, freshMatches.length > 0],
    ["partners", "Участники", partners.length, false],
    ["bids", "Заявки покупателей", pendingBids.length, pendingBids.length > 0],
    ["moderation", "Цены на проверке", data.moderation.length, data.moderation.length > 0],
    ["leads", "Запросы на сделку", data.leads.length, false],
  ];
  $("#tabs").innerHTML = tabs.map(([id, label, n, hot]) => `<button class="tab ${tab === id ? "on" : ""}" data-tab="${id}">${label}<b class="${hot && tab !== id ? "hot" : ""}">${n}</b></button>`).join("");
  $("#view").innerHTML = { new: viewNew, matches: viewMatches, partners: viewPartners, bids: viewBids, moderation: viewModeration, leads: viewLeads }[tab](fresh, partners);
  if (openId) renderDrawer();
}

$("#view").addEventListener("change", async (e) => {
  const sel = e.target.closest("[data-mstatus]");
  if (!sel) return;
  await api(`/api/admin/matches/${sel.dataset.mstatus}`, { method: "PATCH", body: JSON.stringify({ status: sel.value }) }).catch((err) => toast(err.message));
  toast("Статус обновлён");
  load();
});

$("#tabs").addEventListener("click", (e) => {
  const b = e.target.closest("[data-tab]");
  if (b) { tab = b.dataset.tab; render(); }
});

function companyRow(c) {
  const bot = c.role !== "producer" ? `<span class="sub">${esc(c.email || "")}</span>` : c.members.length ? `<span class="badge b-active">✓ бот подключён</span>` : `<span class="sub">бот не подключён</span>`;
  return `<tr class="click" data-open="${c.id}">
    <td><b>${esc(c.name)}</b>${roleTag(c.role)}<div class="sub">${esc(c.code)} · ${c.inn ? "ИНН " + esc(c.inn) : '<span style="color:var(--red)">ИНН не указан</span>'}</div></td>
    <td class="hide-sm">${esc(regionName(c.regionId))}</td>
    <td>${c.role !== "producer" ? '<span class="sub">покупатель</span>' : c.crops.map((x) => `<span class="chip">${esc(cropName(x))}</span>`).join("") || '<span class="sub">не закреплены</span>'}</td>
    <td class="hide-sm">${esc(c.person || "")}<div class="sub">${esc(c.phone || "")}</div></td>
    <td>${badge(c.status)}<div style="margin-top:4px">${bot}</div></td>
  </tr>`;
}

function viewNew(fresh) {
  return `<div class="panel">
    <div class="panel-head"><div><h2>Новые анкеты</h2><p>Регистрации с сайта: предприятия, экспортёры, агенты. Позвоните, проверьте компанию, у предприятия отметьте культуры — и откройте доступ в карточке.</p></div></div>
    ${fresh.length ? `<table><thead><tr><th>Предприятие</th><th class="hide-sm">Регион</th><th>Культуры из анкеты</th><th class="hide-sm">Контакт</th><th>Статус</th></tr></thead><tbody>${fresh.map(companyRow).join("")}</tbody></table>`
      : '<div class="empty">Новых анкет нет</div>'}
  </div>`;
}

function viewPartners(_f, partners) {
  return `<div class="panel">
    <div class="panel-head"><div><h2>Участники</h2><p>Галочка «Доступ открыт» и культуры — в карточке. Бот спрашивает цены каждое утро.</p></div><button class="btn primary sm" data-new>+ Добавить участника</button></div>
    ${partners.length ? `<table><thead><tr><th>Предприятие</th><th class="hide-sm">Регион</th><th>Культуры</th><th class="hide-sm">Контакт</th><th>Статус</th></tr></thead><tbody>${partners.map(companyRow).join("")}</tbody></table>`
      : '<div class="empty">Пока нет участников. Откройте доступ новой анкете или добавьте вручную.</div>'}
  </div>`;
}

function viewBids() {
  const rank = (b) => (b.status === "pending" ? 0 : 1);
  const list = [...data.bids].sort((a, b) => rank(a) - rank(b) || b.at - a.at);
  return `<div class="panel">
    <div class="panel-head"><div><h2>Заявки покупателей</h2><p>С сайта. В стакан попадают только после «В стакан». Контакты видите только вы.</p></div></div>
    ${list.length ? `<table><thead><tr><th>Когда</th><th>Культура</th><th>Цена, ₽/т</th><th>Объём</th><th class="hide-sm">Кто</th><th>Контакт</th><th></th></tr></thead><tbody>
      ${list.map((b) => `<tr>
        <td class="num">${date(b.at)}</td>
        <td>${esc(cropName(b.crop))}<div class="sub">${b.regions.length ? esc(b.regions.map(regionName).join(", ")) : "любые регионы"}</div></td>
        <td class="num"><b>${rub(b.price)}</b></td>
        <td class="num">${rub(b.volume)} т</td>
        <td class="hide-sm">${b.buyer === "agent" ? "агент" : "экспортёр"}</td>
        <td>${esc(b.name)}<div class="sub">${esc(b.contact)}</div></td>
        <td style="white-space:nowrap">${b.status === "pending"
          ? `<button class="btn primary sm" data-bid="${b.id}" data-act="approve">В стакан</button> <button class="btn sm danger" data-bid="${b.id}" data-act="reject">Отклонить</button>`
          : `<span class="badge b-active">в стакане</span> <button class="btn sm" data-bid="${b.id}" data-act="reject">Снять</button>`}</td>
      </tr>`).join("")}</tbody></table>` : '<div class="empty">Заявок нет</div>'}
  </div>`;
}

const MSTATUS = { new: "Новое", working: "В работе", done: "Сделка", rejected: "Отказ" };
function side(p) {
  if (!p) return '<span class="sub">без аккаунта</span>';
  return `<b>${esc(p.name)}</b>${roleTag(p.role)}<div class="sub">${esc([p.person, p.phone, p.email].filter(Boolean).join(" · "))}</div>`;
}
function viewMatches() {
  return `<div class="panel">
    <div class="panel-head"><div><h2>Совпадения цен</h2><p>Покупатель готов заплатить не меньше цены предприятия. Свяжитесь со сторонами; «Сообщить сторонам» — предприятию в бот и обоим в личный кабинет.</p></div></div>
    ${data.matches.length ? `<table><thead><tr><th>Когда</th><th>Культура</th><th>Покупатель</th><th>Предприятие</th><th>Цены, ₽/т</th><th>Статус</th><th></th></tr></thead><tbody>
      ${data.matches.map((m) => `<tr class="${m.status === "new" ? "hl" : ""}">
        <td class="num">${date(m.createdAt)}</td>
        <td>${esc(cropName(m.crop))}<div class="sub">${esc(regionName(m.regionId))}</div></td>
        <td>${side(m.buyer)}<div class="sub num">хочет ${rub(m.bidVolume)} т</div></td>
        <td>${side(m.seller)}<div class="sub num">продаёт ${rub(m.askVolume)} т</div></td>
        <td class="num">покупка <b>${rub(m.bidPrice)}</b><br/>продажа <b>${rub(m.askPrice)}</b><div class="sub" style="color:var(--brand)">+${rub(m.bidPrice - m.askPrice)}</div></td>
        <td><select data-mstatus="${m.id}">${Object.entries(MSTATUS).map(([k, v]) => `<option value="${k}" ${k === m.status ? "selected" : ""}>${v}</option>`).join("")}</select>
          ${m.notified ? '<div class="sub" style="margin-top:4px">✓ стороны уведомлены</div>' : ""}</td>
        <td>${m.notified ? "" : `<button class="btn primary sm" data-notify="${m.id}">Сообщить сторонам</button>`}</td>
      </tr>`).join("")}</tbody></table>` : '<div class="empty">Совпадений пока нет. Они появятся, как только заявка покупателя окажется не ниже цены предприятия.</div>'}
  </div>`;
}

function viewModeration() {
  return `<div class="panel">
    <div class="panel-head"><div><h2>Цены на проверке</h2><p>Цены, заметно отличающиеся от рынка. До решения в котировку не входят.</p></div></div>
    ${data.moderation.length ? `<table><thead><tr><th>Когда</th><th>Предприятие</th><th>Культура</th><th>Цена</th><th>Объём</th><th></th></tr></thead><tbody>
      ${data.moderation.map((q) => `<tr>
        <td class="num">${date(q.at)}</td><td>${esc(q.companyName)}</td><td>${esc(cropName(q.crop))}</td>
        <td class="num"><b>${rub(q.price)}</b> ₽/т</td><td class="num">${rub(q.volume)} т</td>
        <td style="white-space:nowrap"><button class="btn primary sm" data-quote="${q.id}" data-act="approve">Принять</button> <button class="btn sm danger" data-quote="${q.id}" data-act="reject">Отклонить</button></td>
      </tr>`).join("")}</tbody></table>` : '<div class="empty">Спорных цен нет</div>'}
  </div>`;
}

function viewLeads() {
  const role = { exporter: "Экспортёр", agent: "Агент", producer: "Производитель" };
  return `<div class="panel">
    <div class="panel-head"><div><h2>Обращения</h2><p>Заявки с сайта и запросы на сделку по цене из стакана.</p></div></div>
    ${data.leads.length ? `<table><thead><tr><th>Когда</th><th>Кто</th><th>Контакт</th><th>Объём</th><th>Что хотят</th></tr></thead><tbody>
      ${data.leads.map((l) => `<tr><td class="num">${date(l.createdAt)}</td><td>${esc(role[l.role] || l.role)}<div class="sub">${esc(l.name)}</div></td><td>${esc(l.contact)}</td><td class="num">${l.volume ? rub(l.volume) + " т" : "—"}</td><td>${esc(l.comment || l.target)}</td></tr>`).join("")}
    </tbody></table>` : '<div class="empty">Обращений нет</div>'}
  </div>`;
}

$("#view").addEventListener("click", async (e) => {
  const row = e.target.closest("[data-open]");
  if (row) { openId = row.dataset.open; renderDrawer(); return; }
  if (e.target.closest("[data-new]")) { openId = "new"; renderDrawer(); return; }
  const bid = e.target.closest("[data-bid]");
  if (bid) {
    bid.disabled = true;
    const r = await api(`/api/admin/bids/${bid.dataset.bid}/${bid.dataset.act}`, { method: "POST" }).catch((err) => (toast(err.message), null));
    toast(bid.dataset.act !== "approve" ? "Заявка снята" : r?.matches ? `Заявка в стакане · найдено совпадений: ${r.matches}` : "Заявка в стакане");
    if (r?.matches) tab = "matches";
    return load();
  }
  const nt = e.target.closest("[data-notify]");
  if (nt) {
    nt.disabled = true;
    try { const r = await api(`/api/admin/matches/${nt.dataset.notify}/notify`, { method: "POST" }); toast(r.bot ? "Стороны уведомлены (предприятию — в бот)" : "Уведомлено в личных кабинетах"); }
    catch (err) { toast(err.message); }
    return load();
  }
  const q = e.target.closest("[data-quote]");
  if (q) {
    q.disabled = true;
    await api(`/api/admin/quotes/${q.dataset.quote}/${q.dataset.act}`, { method: "POST" }).catch((err) => toast(err.message));
    toast(q.dataset.act === "approve" ? "Цена принята" : "Цена отклонена");
    return load();
  }
});

// ── Карточка участника ─────────────────────────────────────────────────────
function renderDrawer() {
  const isNew = openId === "new";
  const c = isNew
    ? { role: "producer", email: "", name: "", inn: "", regionId: data.regions[0].id, person: "", phone: "", crops: [], notes: "", status: "new", members: [], code: "новый", inviteLink: null }
    : data.companies.find((x) => x.id === openId);
  if (!c) { closeDrawer(); return; }
  // Не перерисовываем открытую карточку при фоновом обновлении, чтобы не потерять ввод
  if (!isNew && $("#drawerRoot").dataset.id === openId) return;
  $("#drawerRoot").dataset.id = openId;
  $("#drawerRoot").innerHTML = `
    <div class="scrim" data-close></div>
    <aside class="drawer">
      <div class="drawer-head">
        <div><h3>${esc(c.name || "Новый участник")}${isNew ? "" : roleTag(c.role)}</h3><div class="sub">${esc(c.code)} ${isNew ? "" : "· " + badge(c.status)}</div></div>
        <button class="btn sm" data-close>✕</button>
      </div>
      <div class="drawer-body">
        ${isNew ? "" : `<div class="box">
          <label class="access"><input type="checkbox" id="fAccess" ${c.status === "active" ? "checked" : ""} />
            <span><b>Доступ открыт</b><span class="sub">${c.role === "producer" ? "Может подавать цены в личном кабинете и в боте; бот каждое утро спрашивает цены по закреплённым культурам." : "Может ставить заявки на покупку и запрашивать сделки в личном кабинете."} Снимите галочку, чтобы отключить.</span></span>
          </label>
        </div>`}
        ${isNew ? `<div class="box"><h4>Роль</h4><select id="fRole"><option value="producer">Предприятие (продаёт)</option><option value="exporter">Экспортёр (покупает)</option><option value="agent">Агент (покупает)</option></select>
          <label class="f" style="margin-top:10px">Email для входа в кабинет (необязательно)<input type="text" id="fEmail" /></label></div>` : ""}
        <div class="box" ${!isNew && c.role !== "producer" ? 'style="display:none"' : ""}>
          <h4>Культуры участника</h4>
          <div class="crops">${data.crops.map((x) => `<label><input type="checkbox" name="crop" value="${x.id}" ${c.crops.includes(x.id) ? "checked" : ""}/>${esc(x.name)}</label>`).join("")}</div>
        </div>
        <div class="box">
          <h4>Предприятие и контакт</h4>
          <label class="f">Название<input type="text" id="fName" value="${esc(c.name)}" /></label>
          <div class="grid2">
            <label class="f">ИНН<input type="text" id="fInn" value="${esc(c.inn || "")}" />${c.inn ? `<a class="sub" href="https://www.rusprofile.ru/search?query=${esc(c.inn)}" target="_blank" rel="noopener">Проверить в Rusprofile ↗</a>` : ""}</label>
            <label class="f">Регион склада<select id="fRegion">${data.regions.map((r) => `<option value="${r.id}" ${r.id === c.regionId ? "selected" : ""}>${esc(r.name)}</option>`).join("")}</select></label>
          </div>
          <div class="grid2">
            <label class="f">Контактное лицо<input type="text" id="fPerson" value="${esc(c.person || "")}" /></label>
            <label class="f">Телефон<input type="tel" id="fPhone" value="${esc(c.phone || "")}" /></label>
          </div>
        </div>
        ${isNew ? "" : `<div class="box">
          <h4>Личный кабинет</h4>
          <div class="sub" style="margin-bottom:8px">Логин: ${esc(c.email || "не задан")}. ${c.hasPassword ? "Пароль задан." : "Пароль не задан."}</div>
          <button class="btn sm" data-resetpw>Сбросить пароль</button>
          <div id="pwBox" class="sub" style="margin-top:8px"></div>
        </div>`}
        ${isNew || c.role !== "producer" ? "" : `<div class="box">
          <h4>Telegram-бот</h4>
          ${c.members.length
            ? c.members.map((m) => `<div>✓ ${esc(m.name || m.userId)} <span class="sub">(${m.channel === "max" ? "MAX" : "Telegram"})</span></div>`).join("")
            : `<div class="sub" style="margin-bottom:8px">Ещё не подключён. Участник открывает бота и нажимает «Отправить номер» — номер должен совпасть с телефоном в карточке. Или отправьте ему личную ссылку:</div>`}
          ${c.inviteLink ? `<div class="copy" style="margin-top:8px"><input type="text" readonly value="${esc(c.inviteLink)}" id="fInvite" /><button class="btn sm" data-copy>Копировать</button></div>` : ""}
        </div>`}
        <div class="box">
          <h4>Заметки по разговору</h4>
          <textarea id="fNotes" rows="7" placeholder="Когда звонили, что обсудили, объёмы, условия…">${esc(c.notes)}</textarea>
        </div>
        <div id="drawerErr" class="err"></div>
      </div>
      <div class="drawer-foot">
        <button class="btn primary" data-save>${isNew ? "Создать" : "Сохранить"}</button>
        ${isNew ? "" : `<button class="btn" data-ask ${c.status === "active" && c.members.length ? "" : "disabled"} title="Бот сразу спросит цены по культурам">Запросить цены сейчас</button>`}
      </div>
    </aside>`;
}

function closeDrawer() {
  openId = null;
  $("#drawerRoot").innerHTML = "";
  delete $("#drawerRoot").dataset.id;
}

$("#drawerRoot").addEventListener("click", async (e) => {
  if (e.target.closest("[data-close]")) return closeDrawer();
  if (e.target.closest("[data-copy]")) {
    const v = $("#fInvite").value;
    try { await navigator.clipboard.writeText(v); } catch { $("#fInvite").select(); document.execCommand("copy"); }
    return toast("Ссылка скопирована");
  }
  if (e.target.closest("[data-resetpw]")) {
    if (!confirm("Сбросить пароль? Участник войдёт с временным паролем, который вы ему передадите.")) return;
    try {
      const r = await api(`/api/admin/companies/${openId}/password`, { method: "POST" });
      $("#pwBox").innerHTML = `Временный пароль: <b style="font-size:15px;color:var(--text)">${esc(r.password)}</b> — передайте участнику, он сможет сменить его в кабинете.`;
    } catch (err) { toast(err.message); }
    return;
  }
  if (e.target.closest("[data-ask]")) {
    try { const r = await api(`/api/admin/companies/${openId}/ask`, { method: "POST" }); toast(`Запрос отправлен (${r.sent})`); }
    catch (err) { toast(err.message); }
    return;
  }
  if (e.target.closest("[data-save]")) {
    const body = {
      name: $("#fName").value,
      inn: $("#fInn").value,
      regionId: $("#fRegion").value,
      person: $("#fPerson").value,
      phone: $("#fPhone").value,
      notes: $("#fNotes").value,
      crops: [...document.querySelectorAll('input[name=crop]:checked')].map((i) => i.value),
    };
    try {
      if (openId === "new") {
        body.role = $("#fRole").value;
        body.email = $("#fEmail").value;
        const r = await api("/api/admin/companies", { method: "POST", body: JSON.stringify(body) });
        toast("Участник создан");
        openId = r.id;
        delete $("#drawerRoot").dataset.id;
      } else {
        const cur = data.companies.find((x) => x.id === openId);
        const access = $("#fAccess").checked;
        body.status = access ? "active" : cur.status === "active" ? "blocked" : cur.status;
        if (access && cur.role === "producer" && !body.crops.length) { $("#drawerErr").textContent = "Отметьте хотя бы одну культуру — по ним бот будет спрашивать цены."; return; }
        await api(`/api/admin/companies/${openId}`, { method: "PATCH", body: JSON.stringify(body) });
        toast(access && cur.status !== "active" ? "Доступ открыт" : "Сохранено");
        delete $("#drawerRoot").dataset.id;
      }
      await load();
      if (openId && data.companies.find((x) => x.id === openId)?.status === "active") tab = "partners";
      render();
    } catch (err) { $("#drawerErr").textContent = err.message; }
  }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && openId) closeDrawer(); });

async function start() {
  $("#login").classList.add("hidden");
  $("#app").classList.remove("hidden");
  try { await load(); } catch (err) { toast(err.message); }
  clearInterval(start.timer);
  start.timer = setInterval(() => load().catch(() => {}), 20000);
}

if (token) start(); else logout();
</script>
